//  韭菜与画笔 —— 一棵韭菜爬上交易塔，看穿庄家的画笔

const W = 288, H = 512;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fit(){ const s = Math.min(innerWidth / W, innerHeight / H); const k = s >= 2 ? Math.floor(s) : s; cv.style.width = W*k + 'px'; cv.style.height = H*k + 'px'; }

// ---------- 小工具 ----------
const pick = a => a[Math.floor(Math.random()*a.length)];
const R1 = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shade(h,k){ const n=parseInt(h.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k))); return '#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1); }
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = r => (r>=0?'+':'') + (r*100).toFixed(1) + '%';

SPR.heroH = SPR.hero.map((r,i)=> i===11?'....kwkwwkwk....': i===12?'....kwwkkwwk....': r);
SPR.heroS = SPR.hero.map((r,i)=> i===11?'....kwwwwwwk....': i===12?'....kwwkkwwk....': i===13?'.....kkwwkk.....': r);
const GRAY = {g:'z',G:'Z',l:'w'}, DARK = {w:'D',g:'r',G:'p',l:'o',o:'R'}, ANGRY = {s:'o',w:'y',D:'p'};
const _sc = {};
function sprCanvas(name, swap){
  const key = name + (swap ? JSON.stringify(swap) : '');
  if (_sc[key]) return _sc[key];
  const rows = SPR[name], h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  for (let j=0;j<h;j++) for (let i=0;i<w;i++){ let ch = rows[j][i]; if (!ch || ch==='.') continue; if (swap && swap[ch]) ch = swap[ch]; g.fillStyle = P[ch] || ch; g.fillRect(i,j,1,1); }
  return _sc[key] = c;
}
function spr(name, x, y, s=1, o={}){
  const c = sprCanvas(name, o.swap); x = Math.round(x); y = Math.round(y);
  ctx.save(); if (o.alpha!=null) ctx.globalAlpha = o.alpha;
  if (o.flip){ ctx.translate(x + c.width*s, y); ctx.scale(-1,1); ctx.drawImage(c,0,0,c.width*s,c.height*s); }
  else ctx.drawImage(c, x, y, c.width*s, c.height*s);
  ctx.restore();
}
const sprH = n => SPR[n].length;

// ---------- 文字 ----------
const FONT = '"SimSun","宋体","Songti SC","PingFang SC","Microsoft YaHei",sans-serif';
function T(s, x, y, col='#f4f4f4', al='left', sz=12, sh=INK){
  ctx.font = sz+'px '+FONT; ctx.textAlign = al; ctx.textBaseline = 'top'; x=Math.round(x); y=Math.round(y);
  if (sh){ ctx.fillStyle = sh; ctx.fillText(s, x+1, y+1); } ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function TW(s, sz=12){ ctx.font = sz+'px '+FONT; return ctx.measureText(s).width; }
function wrap(s, maxW, sz=12){ const out=[]; for (const para of String(s).split('\n')){ let line=''; for (const ch of para){ if (TW(line+ch,sz) > maxW){ out.push(line); line=ch; } else line+=ch; } out.push(line); } return out; }
const _bt = {};
function bigText(s, x, y, sc, col, ol=INK, sz=12){
  const k = s+'|'+col+'|'+ol+'|'+sz; let c = _bt[k];
  if (!c){
    const w = Math.ceil(TW(s,sz))+6, h = sz+6; c = document.createElement('canvas'); c.width=w; c.height=h;
    const g = c.getContext('2d'); g.font = sz+'px '+FONT; g.textBaseline='top';
    g.fillStyle = ol; for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[2,2],[1,2],[2,1]]) g.fillText(s, 3+dx, 3+dy);
    g.fillStyle = col; g.fillText(s, 3, 3);
    const d = g.getImageData(0,0,w,h); for (let i=3;i<d.data.length;i+=4) d.data[i] = d.data[i]>110?255:0; g.putImageData(d,0,0);
    _bt[k] = c;
  }
  ctx.drawImage(c, Math.round(x - c.width*sc/2), Math.round(y), c.width*sc, c.height*sc);
}
// 3x5 像素数字
const PF = {'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111',
'6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111','+':'000010111010000','-':'000000111000000',
'.':'000000000000010',',':'000000000010100','%':'101001010100101','x':'000101010101000','/':'001001010100100',':':'000010000010000',
' ':'000000000000000','F':'111100111100100','?':'111001011000010'};
function N(s, x, y, col='#f4f4f4', sc=1, al='left', sh=true){
  s = String(s); const cw = 4*sc, w = s.length*cw - sc;
  if (al==='right') x -= w; else if (al==='center') x -= w/2; x=Math.round(x); y=Math.round(y);
  for (let pass = sh?0:1; pass<2; pass++){
    ctx.fillStyle = pass ? col : INK; const o = pass ? 0 : sc;
    for (let i=0;i<s.length;i++){ const g = PF[s[i]] || PF['?']; for (let b=0;b<15;b++) if (g[b]==='1') ctx.fillRect(x+i*cw+(b%3)*sc+o, y+Math.floor(b/3)*sc+o, sc, sc); }
  }
}
function box(x,y,w,h,fill='#1a1c2c',bd='#566c86',hl=null){
  x=Math.round(x); y=Math.round(y); ctx.fillStyle=bd; ctx.fillRect(x+1,y,w-2,h); ctx.fillRect(x,y+1,w,h-2);
  ctx.fillStyle=fill; ctx.fillRect(x+1,y+1,w-2,h-2); if (hl){ ctx.fillStyle=hl; ctx.fillRect(x+2,y+1,w-4,1); }
}

// ---------- 输入 ----------
const ptr = {x:-1,y:-1,down:false}; let clk = null; const keys = {};
function toL(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
cv.addEventListener('pointerdown', e=>{ const p=toL(e); ptr.x=p.x; ptr.y=p.y; ptr.down=true; clk=p; initAudio(); e.preventDefault(); });
cv.addEventListener('pointermove', e=>{ const p=toL(e); ptr.x=p.x; ptr.y=p.y; });
addEventListener('pointerup', ()=> ptr.down=false);
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; initAudio(); if ([' ','arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault(); });
function key(k){ if (keys[k]){ keys[k]=false; return true; } return false; }
const hit = (p,x,y,w,h) => p && p.x>=x && p.x<x+w && p.y>=y && p.y<y+h;
function btn(x,y,w,h,label,o={}){
  const dis = o.disabled, col = o.col || '#333c57';
  const press = !dis && ptr.down && hit(ptr,x,y,w,h); const dy = press?2:0;
  ctx.save(); if (dis) ctx.globalAlpha = .45;
  ctx.fillStyle = INK; ctx.fillRect(x+1, y+2, w-2, h-1);
  box(x, y+dy, w, h-2, col, INK, shade(col,.25));
  ctx.fillStyle = shade(col,-.35); ctx.fillRect(x+1, y+dy+h-4, w-2, 1);
  if (o.icon) spr(o.icon, x+6, y+dy+(h-2)/2-8, 2);
  const lx = o.icon ? x + 22 + (w-22)/2 : x + w/2;
  T(label, lx, y+dy+(h-2)/2-6, o.tc || '#f4f4f4', 'center', 12);
  if (o.sub) N(o.sub, x+w-4, y+dy+3, o.subc||GOLD, 1, 'right');
  ctx.restore();
  if (dis || fadeTo) return false;
  if (clk && hit(clk,x,y,w,h)){ clk=null; sfx('click'); return true; }
  if (o.key && key(o.key)){ sfx('click'); return true; }
  return false;
}
function tapAny(){ if (fadeTo) return false; if (clk){ clk=null; return true; } if (key(' ')||key('enter')) return true; return false; }

// ---------- 声音（WebAudio 芯片音） ----------
let AC=null, master=null, muted=false;
function initAudio(){ if (AC){ if (AC.state==='suspended') AC.resume(); return; } try{ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value=.55; master.connect(AC.destination); mNext = AC.currentTime+.05; }catch(e){} }
function tone(f,d,type='square',v=.06,slide=0,delay=0){ if(!AC||muted)return; const t=AC.currentTime+delay; const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02); }
function noise(d,v=.08,delay=0){ if(!AC||muted)return; const t=AC.currentTime+delay, len=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,len,AC.sampleRate), data=b.getChannelData(0); for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len); const s=AC.createBufferSource(); s.buffer=b; const g=AC.createGain(); g.gain.value=v; s.connect(g); g.connect(master); s.start(t); }
const SFX = {
  click:()=>tone(880,.035,'square',.035),
  buy:()=>{tone(523,.06,'square',.05);tone(784,.09,'square',.05,0,.06);},
  short:()=>{tone(784,.06,'square',.05);tone(466,.1,'square',.05,0,.06);},
  close:()=>{tone(660,.05,'triangle',.08);tone(990,.08,'triangle',.08,0,.05);},
  coin:()=>{tone(988,.05,'square',.045);tone(1319,.16,'square',.045,0,.05);},
  tick:()=>tone(1500+Math.random()*700,.01,'square',.01),
  candle:()=>tone(196,.04,'triangle',.06),
  lock:()=>{for(let i=0;i<3;i++)tone(1250,.07,'square',.05,0,i*.12);},
  tell:()=>tone(300,.3,'sawtooth',.03,260),
  news:()=>{tone(1047,.06,'square',.04);tone(1319,.08,'square',.04,0,.09);},
  harvest:()=>{noise(.6,.16);tone(420,.7,'sawtooth',.07,-360);},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.16,'square',.05,0,i*.09)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.22,'triangle',.08,0,i*.15)),
  text:()=>tone(520+Math.random()*120,.018,'square',.012),
  hurt:()=>tone(220,.16,'square',.06,-140),
  magic:()=>[880,1109,1319,1760].forEach((f,i)=>tone(f,.09,'triangle',.05,0,i*.05)),
  dodge:()=>{tone(600,.05,'square',.05,600);tone(1200,.08,'triangle',.05,0,.05);},
  step:()=>tone(330,.03,'triangle',.06),
};
function sfx(n){ try{ SFX[n] && SFX[n](); }catch(e){} }
const mtof = m => 440*Math.pow(2,(m-69)/12);
const TRACKS = {
  title:{bpm:104,bass:[45,0,45,52,41,0,41,48,43,0,43,50,40,0,40,47],lead:[69,0,72,0,76,0,74,72,71,0,72,0,74,0,0,0,69,0,72,0,76,0,79,77,76,0,74,0,72,0,0,0],lv:.022},
  map:{bpm:92,bass:[48,0,55,0,45,0,52,0,41,0,48,0,43,0,50,0],lead:[72,0,0,76,0,0,79,0,77,0,76,0,74,0,0,0,72,0,0,76,0,0,81,0,79,0,77,0,76,0,0,0],lv:.02},
  battle:{bpm:132,bass:[45,45,57,45,45,57,43,55,41,41,53,41,40,40,52,44],lead:[69,72,76,72,69,72,76,79,77,76,74,72,71,72,74,76],lv:.011},
  boss:{bpm:148,bass:[38,38,50,38,38,50,36,48,34,34,46,34,33,33,45,37],lead:[74,0,77,74,0,81,79,77,72,0,76,72,0,79,77,76,74,0,77,74,0,82,81,79,77,0,76,0,74,0,73,0],lv:.013},
  sad:{bpm:70,bass:[45,0,0,0,41,0,0,0,43,0,0,0,40,0,0,0],lead:[76,0,0,74,72,0,0,0,71,0,0,72,69,0,0,0],lv:.02},
};
let curTrack=null, mStep=0, mNext=0;
function music(name){ if (curTrack===TRACKS[name]) return; curTrack = TRACKS[name]||null; mStep=0; if (AC) mNext = AC.currentTime+.05; }
function note(m,t,d,type,v){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=mtof(m); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.03); }
setInterval(()=>{ if(!AC||!curTrack||muted) return; if (mNext < AC.currentTime) mNext = AC.currentTime+.02; const sd = 60/curTrack.bpm/4;
  while (mNext < AC.currentTime+.15){ const b = curTrack.bass[mStep%curTrack.bass.length], l = curTrack.lead[mStep%curTrack.lead.length];
    if (b) note(b, mNext, sd*1.8, 'triangle', .07); if (l) note(l, mNext, sd*.9, 'square', curTrack.lv); mStep++; mNext += sd; } }, 30);

// ---------- 特效 ----------
let parts=[], floats=[], shake=0, flashA=0, flashC='#fff';
function burst(x,y,n,cols,sp=2,grav=.08,life=40){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=Math.random()*sp; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:life*(.5+Math.random()*.5),col:pick(cols),g:grav,sz:Math.random()<.3?2:1}); } }
function floatText(s,x,y,col='#ffcd75'){ floats.push({s,x,y,col,life:70}); }
function updFx(f){
  for (const p of parts){ p.x+=p.vx*f; p.y+=p.vy*f; p.vy+=p.g*f; p.life-=f; ctx.fillStyle=p.col; ctx.fillRect(Math.round(p.x),Math.round(p.y),p.sz,p.sz); }
  parts = parts.filter(p=>p.life>0 && p.y<H+10); if (parts.length>300) parts.splice(0, parts.length-300);
  for (const t of floats){ t.y-=.4*f; t.life-=f; ctx.globalAlpha = clamp(t.life/30,0,1); T(t.s, t.x, t.y, t.col, 'center'); ctx.globalAlpha=1; }
  floats = floats.filter(t=>t.life>0); if (floats.length>6) floats.splice(0, floats.length-6);
}
let toastS='', toastT=0;
function toast(s){ toastS=s; toastT=150; }

// ---------- 背景 ----------
const TINTS = ['#29366f','#5d275d','#333c57','#257179','#b13e53'];
const _bg = {};
function makeBg(tint, seed){
  const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d'); const rnd=mulberry(seed);
  g.fillStyle=shade(tint,-.78); g.fillRect(0,0,W,H);
  for (let y=0;y<H;y+=8){ const off=(y/8)%2?8:0; for (let x=-16;x<W+16;x+=16){ g.fillStyle=shade(tint,-.66+rnd()*.12); g.fillRect(x+off+1,y+1,14,6); } }
  [[22,40],[218,40]].forEach(([wx,wy])=>{ const ww=48,wh=64;
    g.fillStyle=INK; g.fillRect(wx-3,wy-3,ww+6,wh+6); g.fillStyle='#29366f'; g.fillRect(wx,wy,ww,wh); g.fillStyle='#333c57'; g.fillRect(wx,wy+wh*.55,ww,wh*.45);
    for (let i=0;i<10;i++){ g.fillStyle='#f4f4f4'; g.fillRect(wx+Math.floor(rnd()*ww), wy+Math.floor(rnd()*wh*.5),1,1); }
    let bx=wx; while(bx<wx+ww){ const bw=5+Math.floor(rnd()*8), bh=10+Math.floor(rnd()*30); g.fillStyle=INK; g.fillRect(bx,wy+wh-bh,Math.min(bw,wx+ww-bx),bh);
      for (let yy=wy+wh-bh+2; yy<wy+wh-2; yy+=3) for (let xx=bx+1; xx<Math.min(bx+bw-1,wx+ww); xx+=2) if (rnd()<.3){ g.fillStyle=rnd()<.8?'#ffcd75':'#73eff7'; g.fillRect(xx,yy,1,1); }
      bx+=bw+1; }
    g.fillStyle='#566c86'; g.fillRect(wx+ww/2-1,wy,2,wh); g.fillRect(wx,wy+wh/2-1,ww,2); });
  g.fillStyle=shade(tint,-.55); g.fillRect(0,H-36,W,36); g.fillStyle=shade(tint,-.4); g.fillRect(0,H-36,W,2);
  return c;
}
const bgFor = f => _bg[f] || (_bg[f] = makeBg(TINTS[f%5], f*7+3));
let _tbg=null;
function titleBg(){
  if (_tbg) return _tbg; const c=document.createElement('canvas'); c.width=W; c.height=H; const g=c.getContext('2d'); const rnd=mulberry(42);
  const bands=['#1a1c2c','#1d2238','#222a48','#29366f','#333c57','#3b4470'];
  bands.forEach((col,i)=>{ g.fillStyle=col; g.fillRect(0,i*60,W,60); });
  for (let i=0;i<70;i++){ g.fillStyle=rnd()<.8?'#f4f4f4':'#ffcd75'; g.fillRect(Math.floor(rnd()*W),Math.floor(rnd()*300),1,1); }
  g.fillStyle='#ffcd75'; g.beginPath(); g.arc(230,70,14,0,7); g.fill(); g.fillStyle='#1d2238'; g.beginPath(); g.arc(237,65,12,0,7); g.fill();
  // 交易塔
  g.fillStyle='#0f1020'; g.fillRect(112,120,64,260); g.fillRect(120,96,48,30); g.fillRect(132,70,24,30); g.fillRect(142,46,4,26);
  for (let y=130;y<370;y+=12) for (let x=118;x<170;x+=10) if (rnd()<.4){ g.fillStyle=rnd()<.7?'#ffcd75':'#b13e53'; g.fillRect(x,y,3,4); }
  g.fillStyle='#e43b44'; g.fillRect(141,42,6,6);
  // 山丘
  g.fillStyle='#1a2a2c'; for (let x=0;x<W;x++){ const h=330+Math.sin(x*.03)*14+Math.sin(x*.07)*6; g.fillRect(x,h,1,H-h); }
  g.fillStyle='#16302a'; g.fillRect(0,380,W,H-380);
  return _tbg=c;
}

function genMap(f){
  const types=['battle','event','shop','rest'], w=[.46,.3,.12,.12];
  const rnd=()=>{ let r=Math.random(),a=0; for(let i=0;i<4;i++){ a+=w[i]; if(r<a) return types[i]; } return 'battle'; };
  const rows=[]; for(let i=0;i<3;i++){ let a=rnd(), b=rnd(); if(a===b) b=rnd(); rows.push([a,b]); }
  if (f===0) rows[0]=['battle','battle'];
  if (!rows[2].includes('shop')) rows[2][1]='shop';
  return rows;
}

function phaseAt(s){ let acc=0; for (const ph of B.phases){ if (s<acc+ph.len) return ph; acc+=ph.len; } return B.phases[B.phases.length-1]; }
const eqv = () => B.cash + B.sh*B.price;
const dispP = () => (B.ov && B.ov.type==='fake') ? B.fp : B.price;
const eqDisp = () => B.cash + B.sh*dispP();
const levK = () => R.skills.lev ? 2 : 1;
const HINTS = {0:'庄家正在画这根K线，看它乱跳！',2:'觉得要涨？点【做多】上车，多点几次加仓。',6:'赚到了点【平仓】，叶子才算到手。',10:'仓位越重，庄家关注度涨得越快。',14:'关注度满了会被狙击：倒数结束前平仓就能躲开。'};

function newCandle(){
  const d = B.def, w = B.weather;
  if (B.gapNext){ B.price *= 1 + B.gapNext; B.gapNext = 0; shake = 8; }
  const o = B.price; B.cur = {o,h:o,l:o,c:o,v:0}; B.tick = 0;
  let drift = 0, vol = .012, kind;
  if (B.ov){
    const ov = B.ov, k = ov.t; kind = ov.type;
    if (ov.type==='flatspike'){ drift = 0; vol = .002; }
    else if (ov.type==='pie'){ drift = [.28,.32,.35,-.6][k]; vol = .02; }
    else if (ov.type==='spin'){ drift = 0; vol = .003; }
    else if (ov.type==='fake'){ drift = ov.d; vol = .012; }
    else if (ov.type==='react'){ drift = ov.d; vol = .018; }
    B.mode = ov.type;
  } else {
    const ph = phaseAt(B.sstep); B.ph = ph; kind = ph.kind; drift = ph.drift; vol = ph.vol;
    if (ph.revert) drift += (B.base-o)/B.base*.3; B.mode = 'script';
  }
  B.kindNow = kind;
  if (w && !['pie','flatspike','spin'].includes(B.mode)){ drift += (w.drift||0) + (w.rumorD||0); vol *= (w.volMul||1); }
  drift += B.pendingDrift; B.pendingDrift = 0;
  B.vol = vol*d.volMul; B.target = o*(1 + drift + randn()*B.vol*.8);
  if (B.mode==='pie') B.target = o*(1+drift);
  if (B.mode==='fake'){ if (!B.fcur){ B.fp = o; } const fo=B.fp; B.fcur={o:fo,h:fo,l:fo,c:fo,v:0}; B.ftarget = fo*(1 - B.ov.d*.9 + randn()*.004); }

  // ---- 庄家的小动作（不给文字提示）----
  B.gestT = Math.max(0, B.gestT-1);
  if (B.windup){ B.gest = B.windup.type; B.gestT = 1; }
  else if (!B.ov){
    const a = phaseAt(B.sstep+1), b = phaseAt(B.sstep+2), dir = dirOf(b.kind);
    let inkDir = dir; if (Math.random()<d.fakeTell) inkDir = -inkDir;
    if (inkDir !== B.ink){ B.ink = inkDir; B.dip = 18; }
    if (b!==a && ['pump','dump','shake','breakout'].includes(b.kind) && B.gestT===0){
      let g = dir>0 ? 'up' : 'down'; if (Math.random()<d.fakeTell) g = g==='up'?'down':'up';
      B.gest = d.gest[g]; B.gestT = 2;
    }
  }

function battleTick(){

    if (B.tick < N-1) p = B.cur.o*(1+randn()*.001);

    else p = B.target;
  } else {
    p += (B.target-p)/r + (r>1 ? randn()*tv*p*Math.sqrt((r-1)/r) : 0);

  }

  // 假K线：画给你看的另一条线

  if (B.tick%2===0) sfx('tick');
  // 网格机器人
  const jump = Math.abs(p/prevP-1);

  // 挂单
  if (B.orders){
    const o = B.orders;
    if (p <= o.lo){ fillOrder(1, p, o.ref); }
    else if (p >= o.hi){ fillOrder(-1, p, o.ref); }

  if (B.tpOrder && B.sh!==0){ const t = B.tpOrder; if ((t.dir>0 && p>=t.price) || (t.dir<0 && p<=t.price)){ B.tpOrder=null; floatText('接针止盈！', 140, 300, GOLD); closePos(false); } }
  if (R.skills.tp && B.sh!==0 && (p-B.entry)*Math.sign(B.sh)/B.entry >= .10){ floatText('止盈挂单', 140, 300, GOLD); closePos(false); }

  if (B.heat>=1 && B.warn<=0){ B.warn = 2.4; B.heat = .25; B.bubble = B.def.lines.lock; B.bubbleT = 160; sfx('lock'); flashA=.3; flashC=DANGER; }
  // 赢 / 输
  if (eqv() - B.startEq >= B.hpMax){ endBattle(true); return; }
  if (eqv() < R.line){ harvest(); if (B.over) return; }

}
function fillOrder(dir, p, ref){

function spawnNews(){

function openStack(dir, price){

function trade(dir){

function closePos(silent){
  if (B.sh===0) return 0;

    else floatText(`+${fmt(-total)} 回血`, 214, 92, '#3ec95b');

  // 庄家筹码条

  T('庄', 176, 19, DANGER); box(190, 20, 94, 10, '#1a1c2c', '#333c57'); ctx.fillStyle=DANGER; ctx.fillRect(192,22,Math.round(90*hpLeft),6);
  N(fmt(Math.max(0,B.hpMax-dmg)), 237, 23, '#f4f4f4', 1, 'center');
  if (B.breach>0 && !B.over){ box(6, 36, 74, 14, '#1a1c2c', '#73eff7'); T('破绽 ×2', 12, 37, '#73eff7'); }
  ctx.fillStyle='#333c57'; ctx.fillRect(0,33,W,1); ctx.fillStyle=GOLD; ctx.fillRect(0,33,Math.round(W*Math.min(1,B.step/B.len)),1);
  if (!B.over){
    if (btn(220, 2, 30, 16, B.speed>1?'»»':'»', {col:B.speed>1?'#ef7d57':'#333c57', key:'f'})) B.speed = B.speed>1?1:2;

  spr(B.bossSpr, bx, by, sc, {swap:B.bossSwap});
  if (B.gest) drawGesture(B.gest, bx-8, by+bh*.55, B.t);
  if (B.bubbleT>0 && B.bubble){

    const bx0 = 190 - bw, by0 = 46;

    lines.forEach((l,k)=>T(l, bx0+8, by0+5+k*14, INK, 'left', 12, null));
  }

  // ===== K线图 =====
  box(CX0-4, CY0-4, CX1-CX0+38, CY1-CY0+8, '#10121c', '#333c57');
  const showCur = !(B.over && !B.harvested);
  const barAt = i => B.fakeMap[i] || B.bars[i];
  const all = []; for (let i=0;i<B.bars.length;i++) all.push(barAt(i));
  if (showCur) all.push(B.ov && B.ov.type==='fake' ? B.fcur : B.cur);
  const maxSlots = Math.floor((CX1-CX0-6)/SW); const start = Math.max(0, all.length - maxSlots);
  const vis = all.slice(start);
  let hi = Math.max(...vis.map(b=>b.h)), lo = Math.min(...vis.map(b=>b.l));
  const mg = (hi-lo)*.12 + hi*.004;
  B.vhi = hi+mg > B.vhi ? hi+mg : lerp(B.vhi, hi+mg, .08*f); B.vlo = lo-mg < B.vlo ? lo-mg : lerp(B.vlo, lo-mg, .08*f);
  const volTop = CY1-34, chH = volTop-CY0-10;
  const Y = p => Math.round(CY0+4 + (B.vhi-p)/(B.vhi-B.vlo)*chH);
  const X = i => CX0+2 + (i-start)*SW;
  X_cur = () => X(all.length-1)+2;
  ctx.save(); ctx.beginPath(); ctx.rect(CX0-3, CY0-3, CX1-CX0+36, CY1-CY0+6); ctx.clip();
  for (let k=0;k<=4;k++){ const p = B.vlo+(B.vhi-B.vlo)*k/4, yy=Y(p); ctx.fillStyle='#1d2234'; for (let x=CX0;x<CX1;x+=4) ctx.fillRect(x,yy,2,1); N(p.toFixed(2), CX1+31, yy-2, '#566c86', 1, 'right', false); }
  ctx.fillStyle='#1d2234'; ctx.fillRect(CX0, volTop-2, CX1-CX0, 1);
  if (HIST>=start){ ctx.fillStyle='#333c57'; const xx=X(HIST)-1; for (let y=CY0;y<CY1-14;y+=4) ctx.fillRect(xx,y,1,2); }
  // 局末揭晓：庄家每一段在干嘛
  if (B.over){
    const log = B.log; let s=0;
    for (let k=1;k<=log.length;k++){
      if (k===log.length || log[k]!==log[s]){
        const i0 = HIST + s, i1 = HIST + k - 1;
        if (i1>=start){ const x0=Math.max(CX0,X(i0)-1), x1=X(i1)+SW-1; const tint = KIND_TINT[log[s]];
          if (tint){ ctx.fillStyle=tint; ctx.fillRect(x0, CY0, x1-x0, CY1-CY0-14); }
          if (x1-x0>12) T(KIND_NAME[log[s]]||'', x0+1, CY1-14, BOSS_SKILLS[log[s]]?DANGER:GOLD); }
        s=k; } }
  }
  // 蜡烛 + 成交量
  const vmax = Math.max(2, ...vis.map(b=>b.v||0));
  const blink = Math.floor(B.t/4)%2;
  vis.forEach((b,j)=>{ const i=start+j, x=X(i), isCur = j===vis.length-1 && showCur && !B.over; const col = b.c>=b.o?UP:DN;
    ctx.fillStyle = col; ctx.fillRect(x+1, Y(b.h), 1, Math.max(1,Y(b.l)-Y(b.h)+1));
    const top = Y(Math.max(b.o,b.c)), bot = Y(Math.min(b.o,b.c)); ctx.fillRect(x, top, SW-1, Math.max(1, bot-top+1));
    if (isCur && blink){ ctx.fillStyle='#f4f4f4'; ctx.fillRect(x, top, SW-1, 1); }
    const vh = Math.round(clamp((b.v||0)/vmax,0,1)*20); ctx.fillStyle = col; ctx.globalAlpha=.45; ctx.fillRect(x, CY1-14-vh, SW-1, vh); ctx.globalAlpha=1; });
  // 买卖记号
  for (const m of B.marks){ if (m.i<start) continue; const x=X(m.i)+2, y=Y(m.p);

    else if (m.side==='S'){ ctx.fillStyle='#73eff7'; ctx.fillRect(x,y-4,1,1); ctx.fillRect(x-1,y-5,3,1); ctx.fillRect(x-2,y-6,5,1); }
    else { ctx.fillStyle='#f4f4f4'; ctx.fillRect(x-2,y-2,1,1); ctx.fillRect(x+2,y-2,1,1); ctx.fillRect(x-1,y-1,3,3); ctx.fillRect(x-2,y+2,1,1); ctx.fillRect(x+2,y+2,1,1); } }
  if (B.sh!==0){ const yy=Y(B.entry); ctx.fillStyle='#ef7d57'; for (let x=CX0;x<CX1;x+=6) ctx.fillRect(x,yy,3,1); T('成本', CX0+2, yy-13, '#ef7d57'); }
  if (B.orders){ for (const [pp,lab] of [[B.orders.lo,'接'],[B.orders.hi,'空']]){ const yy=Y(pp); ctx.fillStyle=GOLD; for (let x=CX0;x<CX1;x+=3) ctx.fillRect(x,yy,1,1); T(lab, CX1-12, yy-6, GOLD); } }
  ctx.restore();
  // 庄家的画笔（笔尖的墨色 = 他接下来想画的方向）
  if (!B.over || B.harvested){
    const ci = all.length-1; let tipX = X(ci)+2 + (B.over?0:Math.round(randn()*.6)), tipY = Y(dispP());
    const potX = B.ink>0 ? 202 : B.ink<0 ? 278 : null;
    if (B.dip>0 && potX){ const k = Math.sin(clamp(B.dip/18,0,1)*Math.PI); tipX = Math.round(lerp(tipX, potX, k)); tipY = Math.round(lerp(tipY, potY, k)); }
    const hx = bx+4, hy = by+bh*.62;
    const n = Math.max(1, Math.floor(Math.hypot(tipX-hx, tipY-hy)/2));
    for (let k=0;k<=n;k++){ const xx=Math.round(lerp(hx,tipX,k/n)), yy=Math.round(lerp(hy,tipY-8,k/n)); ctx.fillStyle = k%8<1?'#ffcd75':'#8b5a2b'; ctx.fillRect(xx,yy,2,2); ctx.fillStyle=INK; ctx.fillRect(xx,yy+2,2,1); }
    const inkCol = B.ink>0?UP:B.ink<0?DN:'#94b0c2';

    if (!B.over && Math.random()<.08) parts.push({x:tipX,y:tipY,vx:0,vy:.2,life:30,col:inkCol,g:.05,sz:1});
  }
  if (!B.over){ const pp=dispP(), yy=Y(pp), cc=(B.ov&&B.ov.type==='fake')?B.fcur:B.cur; box(CX1+1, yy-5, 32, 11, cc.c>=cc.o?UP:DN, INK); N(pp.toFixed(2), CX1+17, yy-2, '#f4f4f4', 1, 'center', false); }
  if (B.warn>0 && Math.floor(B.t/5)%2){ ctx.strokeStyle=DANGER; ctx.lineWidth=2; ctx.strokeRect(CX0-3,CY0-3,CX1-CX0+36,CY1-CY0+6); }
  // 市场天气

  if (B.newsT>0 && B.news){ box(CX0, ty, 240, 18, '#1a1c2c', GOLD); box(CX0+2, ty+2, 30, 14, '#b13e53', '#b13e53'); T('快讯', CX0+5, ty+3, '#f4f4f4'); T(B.news.t, CX0+38, ty+3, '#f4f4f4'); }
  if (B.halt>0){ box(CX0+40, CY0+80, 164, 30, '#1a1c2c', GOLD); T('熔断中… '+B.halt.toFixed(1), CX0+122, CY0+88, GOLD, 'center'); }
  if (B.hintT>0 && B.hint){ box(CX0+4, CY1-58, 236, 26, '#257179', '#a7f070'); T(B.hint, CX0+122, CY1-51, '#f4f4f4', 'center'); }
  if (B.freeze>0) T('时间冻结 '+B.freeze.toFixed(1), CX0+122, CY0+80, '#73eff7', 'center');

  // ===== 股吧 =====
  box(0, 334, W, 18, '#141623', '#333c57');
  if (B.chat){ T(B.chatBy+'：', 6, 337, '#566c86'); T(B.chat, 6+TW(B.chatBy+'：'), 337, '#94b0c2'); }

  // ===== 小韭 =====
  const ur = B.sh!==0 ? (dispP()-B.entry)*Math.sign(B.sh)/B.entry : 0;
  let hs = 'hero'; if (ur>.02) hs='heroH'; else if (ur<-.02 || B.warn>0) hs='heroS';
  const hx = 10, hy = 352;
  if (B.harvested){
    const cutY = 27; ctx.drawImage(sprCanvas('hero'), 0, 9, 16, 7, hx, hy+cutY, 48, 21); ctx.fillStyle='#257179'; ctx.fillRect(hx+15,hy+cutY,18,2);
    if (B.harvT<40){ ctx.strokeStyle='#f4f4f4'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(hx+24, hy+cutY, 30, Math.PI*(1+B.harvT/40), Math.PI*(1.2+B.harvT/40)); ctx.stroke(); }
  } else {
    spr(hs, hx, hy + (B.sh!==0 ? Math.round(Math.abs(Math.sin(B.t*.15))*-2) : 0), 3);
    if (hs==='heroS' && Math.floor(B.t/10)%2){ ctx.fillStyle='#73eff7'; ctx.fillRect(hx+38, hy+18, 2, 3); }
  }
  if (B.warn>0){ const cx=hx+24, cy=hy+26, rr2 = 22 + Math.round(B.warn*4); ctx.fillStyle=DANGER;
    for (const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]){ ctx.fillRect(cx+sx*rr2-(sx>0?6:0), cy+sy*rr2-(sy>0?2:0), 6, 2); ctx.fillRect(cx+sx*rr2-(sx>0?2:0), cy+sy*rr2-(sy>0?6:0), 2, 6); }
    N(String(Math.ceil(B.warn/0.8)), cx, hy-14, DANGER, 3, 'center'); }
  const px = 66;
  if (B.sh===0) T('空仓观望', px, 358, '#94b0c2');
  else { const long = B.sh>0; T(long?'做多':'做空', px, 358, long?UP:DN); for (let k=0;k<3;k++){ ctx.fillStyle = k<B.stacks ? (long?UP:DN) : '#333c57'; ctx.fillRect(px+30+k*8, 361, 6, 8); }
    if (R.skills.lev) T('×2', px+58, 358, GOLD); N(pct(ur*levK()), 278, 361, ur>=0?UP:DN, 2, 'right'); }
  if (B.combo>1) T(`连环 x${B.combo}`, 200, 378, GOLD);
  T('关注', px, 378, '#94b0c2');
  const hb = 100; box(px+28, 380, hb+4, 10, '#1a1c2c', '#333c57');
  ctx.fillStyle = B.warn>0 ? DANGER : B.heat<.5?GOLD:B.heat<.8?'#ef7d57':DANGER; ctx.fillRect(px+30, 382, B.warn>0?hb:Math.round(hb*Math.min(1,B.heat)), 6);

  // ===== 按钮 =====
  const live = !B.over && !B.paused && B.halt<=0;
  if (btn(8, 404, 88, 38, '做多', {col:'#b13e53', key:'q', disabled:!live})) trade(1);
  if (btn(100, 404, 88, 38, R.short?'做空':'做空🔒', {col:R.short?'#257179':'#333c57', key:'w', disabled:!live})) trade(-1);
  if (btn(192, 404, 88, 38, '平仓', {col:'#ef7d57', key:'e', disabled:!live || B.sh===0})) closePos(false);
  if (btn(8, 448, 66, 28, R.skills.order?(B.orderCD>0?'挂单'+B.orderCD:'挂单'):'—', {col:'#5a4a1a', icon:'i_net', key:'1', disabled:!live||!R.skills.order||B.orderCD>0})) placeOrder();
  [['hourglass','冻结','2'],['cloak','斗篷','3'],['report','举报','4']].forEach(([k,lab,kk],j)=>{
    if (btn(78+j*68, 448, 64, 28, lab, {col:'#333c57', icon:ITEMS[k].icon, sub:'x'+R.items[k], key:kk, disabled:B.over||B.paused||R.items[k]<=0})) useItem(k); });
  let ix = 8; for (const k of Object.keys(R.skills)){ spr(SKILLS[k].icon, ix, 488, 1); ix += 12; }
  N(`${B.step}/${B.len}`, 280, 496, '#566c86', 1, 'right');

  // ===== 暂停 =====
  if (B.paused && !B.over){
    ctx.fillStyle='#000b'; ctx.fillRect(0,0,W,H); bigText('暂停', W/2, 120, 3, '#f4f4f4');
    let yy = 180; T('你的技能：', 30, yy, GOLD); yy+=18;
    const ks = Object.keys(R.skills); if (!ks.length){ T('还没有。打空庄家的筹码条就能拿。', 30, yy, '#94b0c2'); yy+=18; }
    for (const k of ks){ spr(SKILLS[k].icon, 30, yy+2, 1); T(SKILLS[k].name, 44, yy, SCHOOL_COL[SKILLS[k].school]); yy+=16; }
    if (btn(74, 330, 140, 32, '继续', {col:'#b13e53'})) B.paused=false;
    if (btn(74, 370, 140, 28, muted?'声音：关':'声音：开', {col:'#333c57'})) muted=!muted;
    if (btn(74, 404, 140, 28, '回到标题', {col:'#333c57'})){ B.paused=false; go(TitleScene()); }
  }
  // ===== 结算 =====
  if (B.over && B.harvT > (B.harvested?70:30)){
    ctx.fillStyle='#0009'; ctx.fillRect(0,0,W,H);
    const res = B.result, py = 120;
    box(20, py, 248, 250, '#1a1c2c', res.pass?'#a7f070':DANGER, '#333c57');
    if (B.harvested) bigText('被收割了！', W/2, py+12, 2, DANGER);
    else if (res.kill) bigText('筹码条打空！', W/2, py+12, 2, '#a7f070');
    else if (B.isBoss) bigText('没打空筹码条…', W/2, py+12, 2, DANGER);
    else bigText('撑过去了', W/2, py+12, 2, '#f4f4f4');
    T('庄家剧本：', 40, py+56, '#94b0c2'); T(SCRIPT_NAME[B.def.script]||'', 112, py+56, GOLD);
    T('叶子：', 40, py+80, '#94b0c2'); N(fmt(B.startEq)+' > '+fmt(R.cap), 88, py+83, R.cap>=B.startEq?UP:DN, 1);
    T('收割线：', 40, py+104, '#94b0c2'); N(fmt(R.line), 100, py+107, DANGER, 2);
    let msg;
    if (B.harvested) msg = (res.steal?`庄家抽走了 ${fmt(res.steal)}，\n`:'') + '叶子掉到了收割线以下。' + (R.roots>0?'\n还剩一条根，可以重新发芽。':'\n没有根了……');
    else if (!res.pass) msg = `时间到，庄家抽走了 ${fmt(res.steal)}。\n他还站着，再打一次。`;
    else if (res.kill) msg = '庄家的筹码被你打空了！\n去挑一个技能吧。' + (res.book?'\n复利存折 +5%':'');

  }
}};

    t+=f; ctx.fillStyle=INK; ctx.fillRect(0,0,W,H);

// =====================================================================
//  主循环
// =====================================================================
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; const f = dt*60;
  ctx.save();
  if (shake>0){ ctx.translate(Math.round((Math.random()-.5)*shake), Math.round((Math.random()-.5)*shake)); shake = Math.max(0, shake-.6*f); }
  if (fadeTo){ fadeA += .09*f; if (fadeA>=1){ fadeA=1; scene=fadeTo; fadeTo=null; parts=[]; floats=[]; scene.enter && scene.enter(); } }
  else if (fadeA>0) fadeA = Math.max(0, fadeA-.09*f);
  if (scene) scene.frame(f, dt);
  updFx(f);
  if (toastT>0){ toastT-=f; ctx.globalAlpha=clamp(toastT/30,0,1); const w=TW(toastS)+20; box(W/2-w/2, 300, w, 22, '#1a1c2c', GOLD); T(toastS, W/2, 305, '#ffcd75', 'center'); ctx.globalAlpha=1; }
  ctx.restore();
  if (flashA>0){ ctx.fillStyle=flashC; ctx.globalAlpha=flashA; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; flashA=Math.max(0,flashA-.04*f); }
  ctx.fillStyle='#0000000f'; for (let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
  if (fadeA>0){ ctx.fillStyle=INK; ctx.globalAlpha=fadeA; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  clk = null;
  requestAnimationFrame(loop);
}
go(TitleScene());
requestAnimationFrame(loop);
