function fit(){ const s = Math.min(innerWidth / W, innerHeight / H); const k = s >= 2 ? Math.floor(s) : s; cv.style.width = W*k + 'px'; cv.style.height = H*k + 'px'; }

// ---------- 小工具 ----------
const pick = a => a[Math.floor(Math.random()*a.length)];
const R1 = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shade(h,k){ const n=parseInt(h.slice(1),16); const f=v=>Math.max(0,Math.min(255,Math.round(k<0?v*(1+k):v+(255-v)*k))); return '#'+((1<<24)|(f(n>>16)<<16)|(f(n>>8&255)<<8)|f(n&255)).toString(16).slice(1); }

const GRAY = {g:'z',G:'Z',l:'w'}, DARK = {w:'D',g:'r',G:'p',l:'o',o:'R'}, ANGRY = {s:'o',w:'y',D:'p'};
const _sc = {};
function sprCanvas(name, swap){
  const key = name + (swap ? JSON.stringify(swap) : '');
  if (_sc[key]) return _sc[key];
  const rows = SPR[name], h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  for (let j=0;j<h;j++) for (let i=0;i<w;i++){ let ch = rows[j][i]; if (!ch || ch==='.') continue; if (swap && swap[ch]) ch = swap[ch]; g.fillStyle = P[ch] || ch; g.fillRect(i,j,1,1); }
  return _sc[key] = c;
}
function spr(name, x, y, s=1, o={}){
  const c = sprCanvas(name, o.swap); x = Math.round(x); y = Math.round(y);
  ctx.save(); if (o.alpha!=null) ctx.globalAlpha = o.alpha;
  if (o.flip){ ctx.translate(x + c.width*s, y); ctx.scale(-1,1); ctx.drawImage(c,0,0,c.width*s,c.height*s); }
  else ctx.drawImage(c, x, y, c.width*s, c.height*s);
  ctx.restore();
}
const sprH = n => SPR[n].length;

// ---------- 文字 ----------
const FONT = '"SimSun","宋体","Songti SC","PingFang SC","Microsoft YaHei",sans-serif';
function T(s, x, y, col='#f4f4f4', al='left', sz=12, sh=INK){
  ctx.font = sz+'px '+FONT; ctx.textAlign = al; ctx.textBaseline = 'top'; x=Math.round(x); y=Math.round(y);
  if (sh){ ctx.fillStyle = sh; ctx.fillText(s, x+1, y+1); } ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function TW(s, sz=12){ ctx.font = sz+'px '+FONT; return ctx.measureText(s).width; }
// 换行：英文按单词断，中文按字断
function wrap(s, maxW, sz=12){
  const out=[];
  for (const para of String(s).split('\n')){
    const toks = para.match(/[A-Za-z0-9'’%$#@&.,!?:;\-+×()\/"~…*]+\s*|\s+|./g) || [''];
    let line='';
    for (const tk of toks){ if (line && TW(line+tk.trimEnd(),sz) > maxW){ out.push(line.trimEnd()); line = tk.trimStart(); } else line += tk; }
    out.push(line.trimEnd());
  }
  return out;
}
const _bt = {};
function bigText(s, x, y, sc, col, ol=INK, sz=12){
  const k = s+'|'+col+'|'+ol+'|'+sz; let c = _bt[k];
  if (!c){
    const w = Math.ceil(TW(s,sz))+6, h = sz+6; c = document.createElement('canvas'); c.width=w; c.height=h;
    const g = c.getContext('2d'); g.font = sz+'px '+FONT; g.textBaseline='top';
    g.fillStyle = ol; for (const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1],[2,2],[1,2],[2,1]]) g.fillText(s, 3+dx, 3+dy);
    g.fillStyle = col; g.fillText(s, 3, 3);
    const d = g.getImageData(0,0,w,h); for (let i=3;i<d.data.length;i+=4) d.data[i] = d.data[i]>110?255:0; g.putImageData(d,0,0);
    _bt[k] = c;
  }
  ctx.drawImage(c, Math.round(x - c.width*sc/2), Math.round(y), c.width*sc, c.height*sc);
}
// 3x5 像素数字
const PF = {'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111',
'6':'111100111101111','7':'111001001001001','8':'111101111101111','9':'111101111001111','+':'000010111010000','-':'000000111000000',
'.':'000000000000010',',':'000000000010100','%':'101001010100101','x':'000101010101000','/':'001001010100100',':':'000010000010000',
' ':'000000000000000','F':'111100111100100','?':'111001011000010'};
function N(s, x, y, col='#f4f4f4', sc=1, al='left', sh=true){
  s = String(s); const cw = 4*sc, w = s.length*cw - sc;
  if (al==='right') x -= w; else if (al==='center') x -= w/2; x=Math.round(x); y=Math.round(y);
  for (let pass = sh?0:1; pass<2; pass++){
    ctx.fillStyle = pass ? col : INK; const o = pass ? 0 : sc;
    for (let i=0;i<s.length;i++){ const g = PF[s[i]] || PF['?']; for (let b=0;b<15;b++) if (g[b]==='1') ctx.fillRect(x+i*cw+(b%3)*sc+o, y+Math.floor(b/3)*sc+o, sc, sc); }
  }
}
function box(x,y,w,h,fill='#1a1c2c',bd='#566c86',hl=null){
  x=Math.round(x); y=Math.round(y); ctx.fillStyle=bd; ctx.fillRect(x+1,y,w-2,h); ctx.fillRect(x,y+1,w,h-2);
  ctx.fillStyle=fill; ctx.fillRect(x+1,y+1,w-2,h-2); if (hl){ ctx.fillStyle=hl; ctx.fillRect(x+2,y+1,w-4,1); }
}

// ---------- 输入 ----------
const ptr = {x:-1,y:-1,down:false}; let clk = null; const keys = {};
function toL(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
cv.addEventListener('pointerdown', e=>{ const p=toL(e); ptr.x=p.x; ptr.y=p.y; ptr.down=true; clk=p; initAudio(); e.preventDefault(); });
cv.addEventListener('pointermove', e=>{ const p=toL(e); ptr.x=p.x; ptr.y=p.y; });
addEventListener('pointerup', ()=> ptr.down=false);
addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; initAudio(); if ([' ','arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault(); });
function key(k){ if (keys[k]){ keys[k]=false; return true; } return false; }
const hit = (p,x,y,w,h) => p && p.x>=x && p.x<x+w && p.y>=y && p.y<y+h;
function btn(x,y,w,h,label,o={}){
  const dis = o.disabled, col = o.col || '#333c57';
  const press = !dis && ptr.down && hit(ptr,x,y,w,h); const dy = press?2:0;
  ctx.save(); if (dis) ctx.globalAlpha = .45;
  ctx.fillStyle = INK; ctx.fillRect(x+1, y+2, w-2, h-1);
  box(x, y+dy, w, h-2, col, INK, shade(col,.25));
  ctx.fillStyle = shade(col,-.35); ctx.fillRect(x+1, y+dy+h-4, w-2, 1);
  if (o.icon) spr(o.icon, x+6, y+dy+(h-2)/2-8, 2);
  const lx = o.icon ? x + 22 + (w-22)/2 : x + w/2;
  T(label, lx, y+dy+(h-2)/2-6, o.tc || '#f4f4f4', 'center', 12);
  if (o.sub) N(o.sub, x+w-4, y+dy+3, o.subc||GOLD, 1, 'right');
  ctx.restore();
  if (dis || fadeTo) return false;
  if (clk && hit(clk,x,y,w,h)){ clk=null; sfx('click'); return true; }
  if (o.key && key(o.key)){ sfx('click'); return true; }
  return false;
}
function tapAny(){ if (fadeTo) return false; if (clk){ clk=null; return true; } if (key(' ')||key('enter')) return true; return false; }

// ---------- 声音（WebAudio 芯片音） ----------
let AC=null, master=null, muted=false;
function initAudio(){ if (AC){ if (AC.state==='suspended') AC.resume(); return; } try{ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.gain.value=.55; master.connect(AC.destination); mNext = AC.currentTime+.05; }catch(e){} }
function tone(f,d,type='square',v=.06,slide=0,delay=0){ if(!AC||muted)return; const t=AC.currentTime+delay; const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.02); }
function noise(d,v=.08,delay=0){ if(!AC||muted)return; const t=AC.currentTime+delay, len=Math.floor(AC.sampleRate*d), b=AC.createBuffer(1,len,AC.sampleRate), data=b.getChannelData(0); for(let i=0;i<len;i++) data[i]=(Math.random()*2-1)*(1-i/len); const s=AC.createBufferSource(); s.buffer=b; const g=AC.createGain(); g.gain.value=v; s.connect(g); g.connect(master); s.start(t); }
const SFX = {

  text:()=>tone(520+Math.random()*120,.018,'square',.012),

  magic:()=>[880,1109,1319,1760].forEach((f,i)=>tone(f,.09,'triangle',.05,0,i*.05)),

function sfx(n){ try{ SFX[n] && SFX[n](); }catch(e){} }
const mtof = m => 440*Math.pow(2,(m-69)/12);
const TRACKS = {
  title:{bpm:104,bass:[45,0,45,52,41,0,41,48,43,0,43,50,40,0,40,47],lead:[69,0,72,0,76,0,74,72,71,0,72,0,74,0,0,0,69,0,72,0,76,0,79,77,76,0,74,0,72,0,0,0],lv:.022},
  map:{bpm:92,bass:[48,0,55,0,45,0,52,0,41,0,48,0,43,0,50,0],lead:[72,0,0,76,0,0,79,0,77,0,76,0,74,0,0,0,72,0,0,76,0,0,81,0,79,0,77,0,76,0,0,0],lv:.02},
  battle:{bpm:132,bass:[45,45,57,45,45,57,43,55,41,41,53,41,40,40,52,44],lead:[69,72,76,72,69,72,76,79,77,76,74,72,71,72,74,76],lv:.011},

  sad:{bpm:70,bass:[45,0,0,0,41,0,0,0,43,0,0,0,40,0,0,0],lead:[76,0,0,74,72,0,0,0,71,0,0,72,69,0,0,0],lv:.02},

let curTrack=null, mStep=0, mNext=0;
function music(name){ if (curTrack===TRACKS[name]) return; curTrack = TRACKS[name]||null; mStep=0; if (AC) mNext = AC.currentTime+.05; }
function note(m,t,d,type,v){ const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=mtof(m); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.03); }
setInterval(()=>{ if(!AC||!curTrack||muted) return; if (mNext < AC.currentTime) mNext = AC.currentTime+.02; const sd = 60/curTrack.bpm/4;
  while (mNext < AC.currentTime+.15){ const b = curTrack.bass[mStep%curTrack.bass.length], l = curTrack.lead[mStep%curTrack.lead.length];
    if (b) note(b, mNext, sd*1.8, 'triangle', .07); if (l) note(l, mNext, sd*.9, 'square', curTrack.lv); mStep++; mNext += sd; } }, 30);

  [[22,40],[218,40]].forEach(([wx,wy])=>{ const ww=48,wh=64;
    g.fillStyle=INK; g.fillRect(wx-3,wy-3,ww+6,wh+6); g.fillStyle='#29366f'; g.fillRect(wx,wy,ww,wh); g.fillStyle='#333c57'; g.fillRect(wx,wy+wh*.55,ww,wh*.45);
    for (let i=0;i<10;i++){ g.fillStyle='#f4f4f4'; g.fillRect(wx+Math.floor(rnd()*ww), wy+Math.floor(rnd()*wh*.5),1,1); }
    let bx=wx; while(bx<wx+ww){ const bw=5+Math.floor(rnd()*8), bh=10+Math.floor(rnd()*30); g.fillStyle=INK; g.fillRect(bx,wy+wh-bh,Math.min(bw,wx+ww-bx),bh);
      for (let yy=wy+wh-bh+2; yy<wy+wh-2; yy+=3) for (let xx=bx+1; xx<Math.min(bx+bw-1,wx+ww); xx+=2) if (rnd()<.3){ g.fillStyle=rnd()<.8?'#ffcd75':'#73eff7'; g.fillRect(xx,yy,1,1); }
      bx+=bw+1; }
    g.fillStyle='#566c86'; g.fillRect(wx+ww/2-1,wy,2,wh); g.fillRect(wx,wy+wh/2-1,ww,2); });
  g.fillStyle=shade(tint,-.55); g.fillRect(0,H-36,W,36); g.fillStyle=shade(tint,-.4); g.fillRect(0,H-36,W,2);

function genPhases(style, total){
  const w = STYLE[style], keys = Object.keys(w), sumW = keys.reduce((a,x)=>a+w[x],0);
  const out=[]; let sum=0, prev=null, bigCD=0;
  while (sum < total+20){
    let k, guard=0;
    do { let r = Math.random()*sumW; for (k of keys){ r -= w[k]; if (r<=0) break; } } while ((k===prev || (REG[k].big && bigCD>0)) && guard++<20);
    const g = REG[k], len = R1(g.l[0], g.l[1]);
    out.push(ph(g.kind, len, lerp(g.d[0],g.d[1],Math.random()), lerp(g.v[0],g.v[1],Math.random()), g.revert?{revert:true}:{}));
    sum += len; prev = k; bigCD = g.big ? 2 : bigCD-1;
  }
  out[out.length-1].len = 99; return out;
}

function genMap(f){

  const rows=[]; for(let i=0;i<3;i++){ let a=rnd(), b=rnd(); if(a===b) b=rnd(); rows.push([a,b]); }

function closePos(silent, force){

// 意图框布局（K 线图右上角正上方）：内容、字号、左右边界都在这里算，叶子让位给它的左边界
function intentLayout(){
  if (!B || B.over) return null;
  const it = B.intent && B.intent.pending ? B.intent : null;
  const said = it || B.claimNow;
  const collapse = !!B.collapse;
  if (collapse && !said){
    let sz = 13, w = Math.max(76, TW(t('rKill'), sz) + 14);
    return {kind:'broke', x0:INTENT_R-w, w, sz, collapse:true};
  }
  const head = it ? t('next') : t('now');
  const lab = said ? claimLabel(said.claim) : {txt:'???', col:'#94b0c2'};
  const tagTxt = said ? (collapse ? t('trueT') : (R.skills.lie ? (said.truth ? t('trueT') : t('lieT')) : null)) : null;
  const cnt = it ? String(Math.max(0, it.at-B.step)) : '';
  let sz = 13;
  const calc = () => {
    const inner = TW(head, sz) + 5 + TW(lab.txt, sz) + (it ? 7 + 4*cnt.length - 1 : 0);
    return {mainW: Math.max(74, inner + 14), tagW: tagTxt ? TW(tagTxt, 10) + 10 : 0};
  };
  let m = calc();
  while (sz > 10 && m.mainW + (tagTxt ? m.tagW + 3 : 0) > 172){ sz--; m = calc(); }
  const gap = tagTxt ? m.tagW + 3 : 0;
  return {kind:'intent', it, said, head, lab, sz, cnt, tagTxt, tagW:m.tagW, mainW:m.mainW,
          x0:INTENT_R-(m.mainW+gap), mainX:INTENT_R-m.mainW, collapse};
}

  // 妨碍类提示：拔网线的预告 K 线里闪 Wi-Fi；手续费暴涨时挂显眼的 3% 价签（按钮区上方）
  if (!B.over && B.windup && B.windup.type==='unplug' && Math.floor(B.t/8)%2)
    spr('i_wifi', 258, 398, 2, {swap:{k: Math.floor(B.t/16)%2 ? 'y' : 'o'}});
  if (!B.over && curseType()==='fee'){ box(150, 398, 86, 16, '#1a1c2c', '#ef7d57'); T(t('feeBadge'), 193, 401, '#ef7d57', 'center'); }

  // ===== 按钮 =====
  const live = !B.over && !B.paused && B.halt<=0;
  const cT = (!B.over && !B.paused) ? curseType() : null;
  const netDown = cT==='unplug', halted2 = cT==='halt2', allIn = cT==='allin';
  const critTag = crit ? ' ×2' : '';
  const longCol = shade(UP,-.35), shortCol = shade(DN,-.35);
  const lockN = Math.max(0, (B.lockAt||0) - B.bars.length);
  const upLab = halted2 ? t('halt2') : netDown ? t('long') : allIn ? t('allinBtn')+'↑'+critTag : t('long')+critTag;
  const dnLab = halted2 ? t('halt2') : netDown ? (R.short?t('short'):t('shortLock')) : allIn ? t('allinBtn')+'↓'+critTag : (R.short?t('short')+critTag:t('shortLock'));
  const closeLab = halted2 ? t('halt2') : t('close') + (lockN>0 ? '🔒'+lockN : '');
  if (crit && live && !netDown && !halted2){ ctx.fillStyle = Math.floor(B.t/6)%2 ? GOLD : shade(GOLD,-.3); ctx.fillRect(6, BTN_Y-2, 184, 38); }
  if (btn(8, BTN_Y, 88, 34, upLab, {col:(netDown||halted2)?'#333c57':longCol, key:'q', disabled:halted2||(!live&&!netDown), tc:(netDown||halted2)?'#94b0c2':crit?GOLD:'#f4f4f4'})){
    if (netDown) toast(t('tNetDown')); else trade(1); }
  if (btn(100, BTN_Y, 88, 34, dnLab, {col:(netDown||halted2)?'#333c57':(R.short?shortCol:'#333c57'), key:'w', disabled:halted2||(!live&&!netDown), tc:(netDown||halted2)?'#94b0c2':crit&&R.short?GOLD:'#f4f4f4'})){
    if (netDown) toast(t('tNetDown')); else trade(-1); }
  if (btn(192, BTN_Y, 88, 34, closeLab, {col:(netDown||halted2)?'#333c57':'#ef7d57', key:'e', disabled:halted2||(!netDown&&(!live||B.sh===0||lockN>0)), tc:(netDown||halted2)?'#94b0c2':lockN>0?GOLD:'#f4f4f4'})){
    if (netDown) toast(t('tNetDown')); else if (lockN>0) toast(fmtS(t('t1Lock'),{n:lockN})); else closePos(false); }
  // 第二排：技能 + 道具（图标 + 名字都压在同一个按钮里，省一行）
  const row = [
    {lab:t('order'), icon:'i_net', sub:R.skills.order?(B.orderCD>0?String(B.orderCD):''):'', dis:!live||!R.skills.order||B.orderCD>0, fn:placeOrder, key:'1', col:'#5a4a1a'},
    {lab:t('bluff'), icon:'i_phone', sub:R.skills.bluff?(B.bluffCD>0?String(B.bluffCD):''):'', dis:!live||!R.skills.bluff||B.bluffCD>0, fn:callBluff, key:'2', col:'#2a4a1a'},
    {lab:t('hourglass'), icon:'i_glass', sub:'x'+R.items.hourglass, dis:B.over||B.paused||R.items.hourglass<=0, fn:()=>useItem('hourglass'), key:'3', col:'#333c57'},
    {lab:t('cloak'), icon:'i_cloak', sub:'x'+R.items.cloak, dis:B.over||B.paused||R.items.cloak<=0, fn:()=>useItem('cloak'), key:'4', col:'#333c57'},
    {lab:t('report'), icon:'i_report', sub:'x'+R.items.report, dis:B.over||B.paused||R.items.report<=0, fn:()=>useItem('report'), key:'5', col:'#333c57'},
  ];
  row.forEach((b,j)=>{ const x = 8+j*55; const gray = netDown || b.dis;
    // 断网时道具/技能也灰掉，但不能真 disabled：点一下要能提示"断网了"
    if (btn(x, ITEM_Y, 52, 32, '', {col:gray?'#333c57':b.col, key:b.key, disabled:netDown?false:b.dis, sub:b.sub})){
      if (netDown) toast(t('tNetDown')); else b.fn(); }
    spr(b.icon, x+18, ITEM_Y+1, 2, {alpha:gray?.45:1}); T(b.lab, x+26, ITEM_Y+18, gray?'#566c86':'#94b0c2', 'center', 10); });

  // ===== 暂停 =====
  if (B.paused && !B.over){
    ctx.fillStyle='#000b'; ctx.fillRect(0,0,W,H); bigText(t('paused'), W/2, 110, 3, '#f4f4f4');
    let yy = 170; T(t('yourSkills'), 24, yy, GOLD); yy+=18;
    const ks = Object.keys(R.skills); if (!ks.length){ wrap(t('noSkills'),240).forEach(l=>{T(l, 24, yy, '#94b0c2'); yy+=16;}); }
    for (const k of ks){ spr(SKILLS[k].icon, 24, yy+2, 1); T(C.skill[k][0], 38, yy, SCHOOL_COL[SKILLS[k].school]); yy+=16; }
    if (btn(74, 340, 140, 32, t('resume'), {col:'#b13e53'})) B.paused=false;
    if (btn(74, 380, 140, 28, muted?t('sndOff'):t('sndOn'), {col:'#333c57'})) muted=!muted;
    if (btn(74, 414, 140, 28, t('toTitle'), {col:'#333c57'})){ B.paused=false; go(TitleScene()); }
  }
  // ===== 结算（图表上保留回放） =====
  if (B.over && B.harvT > (B.harvested?70:30)){
    const res = B.result, py = 354;
    ctx.fillStyle='#000c'; ctx.fillRect(0,py-2,W,H-py+2);
    box(6, py, 276, 154, '#1a1c2c', res.pass?'#a7f070':DANGER, '#333c57');
    const title = B.harvested ? t('rHarv') : res.kill ? t('rKill') : B.isBoss ? t('rFail') : t('rSurv');
    bigText(title, W/2, py+3, 2, B.harvested||!res.pass?DANGER:res.kill?GOLD:'#f4f4f4');
    T(t('rScript')+C.script[B.def.script], 16, py+38, GOLD);
    const tr = B.intentLog.filter(x=>x.truth).length; T(t('rIntent'), 16, py+52, '#94b0c2'); T(`✓${tr}  ✗${B.intentLog.length-tr}`, 16+TW(t('rIntent')), py+52, '#f4f4f4');
    T(t('rMoney'), 150, py+38, '#94b0c2'); N(fmt(R.cap), 278, py+41, R.cap>=B.startEq?'#a7f070':DANGER, 1, 'right');
    T(t('rLine'), 150, py+52, '#94b0c2'); N(fmt(R.line), 278, py+55, DANGER, 1, 'right');
    let msg;
    if (B.harvested) msg = (res.steal?fmtS(t('mHarvSteal'),{n:fmt(res.steal)}):'') + t('mHarv') + (R.roots>0?t('mRoot'):t('mNoRoot'));
    else if (!res.pass) msg = fmtS(t('mFail'),{n:fmt(res.steal)});
    else if (res.kill) msg = fmtS(t('mKill'),{n:fmt(res.loot)}) + (res.book?t('mBook'):'');
    else msg = res.steal ? fmtS(t('mSteal'),{n:fmt(res.steal)}) : t('mSurv');
    wrap(msg, 256).slice(0,4).forEach((l,k)=>T(l, 16, py+68+k*15, res.pass?'#f4f4f4':'#ef7d57'));
    if (btn(84, py+128, 120, 24, t('cont'), {col:'#b13e53', key:'enter'})) afterBattle();
  }
}};

// ---------- 结束画面 ----------
function TestEndScene(){
  let tt=0;
  return { enter(){ music('title'); }, frame(f){
    tt+=f; ctx.drawImage(titleBg(),0,0); ctx.fillStyle='#000a'; ctx.fillRect(0,0,W,H);
    bigText(t('testEnd'), W/2, 90, 2, GOLD); T(t('testWin'), W/2, 140, '#f4f4f4', 'center');
    spr(HERO('H'), W/2-24, 170 + Math.round(Math.abs(Math.sin(tt*.08))*-8), 3);
    box(34, 240, 220, 120, '#1a1c2cdd', '#566c86');
    T(t('sFinal'), 50, 252, '#94b0c2'); N(fmt(R.cap), 238, 255, GOLD, 2, 'right');
    T(t('sTrades'), 50, 276, '#94b0c2'); N(String(R.stats.trades), 238, 279, '#f4f4f4', 2, 'right');
    T(t('sHarv'), 50, 300, '#94b0c2'); N(String(R.stats.harvested), 238, 303, '#f4f4f4', 2, 'right');
    T(t('sSkills'), 50, 324, '#94b0c2'); let ix=238-11*Object.keys(R.skills).length; for (const k of Object.keys(R.skills)){ spr(SKILLS[k].icon, ix, 326, 1); ix+=11; }
    T(t('testFoot'), W/2, 390, '#94b0c2', 'center');
    if (btn(74, 440, 140, 30, t('toTitle'), {col:'#b13e53'})) go(TitleScene());
  }};
}
function GameOverScene(){
  let tt=0;
  return { enter(){ music('sad'); SAVE.best = Math.max(SAVE.best, R.floor+1); writeSave(SAVE); }, frame(f){
    tt+=f; ctx.fillStyle=INK; ctx.fillRect(0,0,W,H);
    for (let i=0;i<40;i++){ ctx.fillStyle='#29366f'; ctx.fillRect((i*37+Math.floor(tt*2))%W, (i*53+Math.floor(tt*6))%H, 1, 4); }
    if (LANG==='en') spr('sheepS', W/2-24, 240, 3, {swap:{w:'s',z:'s'}});
    else { ctx.drawImage(sprCanvas('hero'), 0, 9, 16, 7, W/2-24, 260, 48, 21); ctx.fillStyle='#257179'; ctx.fillRect(W/2-9,260,18,2); }
    bigText(t('goTitle'), W/2, 120, 2, DANGER);
    T(fmtS(t('goWhere'),{f:C.floors[R.floor]}), W/2, 180, '#94b0c2', 'center');
    T(fmtS(t('goStats'),{t:R.stats.trades,h:R.stats.harvested}), W/2, 200, '#94b0c2', 'center');
    T(t('goQuote'), W/2, 320, GOLD, 'center'); T(t('goWho'), W/2+50, 340, '#566c86', 'center');
    if (btn(74, 400, 140, 32, t('goAgain'), {col:'#257179'})){ newRun(); go(MapScene()); }
    if (btn(74, 440, 140, 28, t('toTitle'), {col:'#333c57'})) go(TitleScene());
  }};
}

// =====================================================================
//  主循环
// =====================================================================
let last = performance.now();
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; const f = dt*60;
  ctx.save();
  if (shake>0){ ctx.translate(Math.round((Math.random()-.5)*shake), Math.round((Math.random()-.5)*shake)); shake = Math.max(0, shake-.6*f); }
  if (fadeTo){ fadeA += .09*f; if (fadeA>=1){ fadeA=1; scene=fadeTo; fadeTo=null; parts=[]; floats=[]; scene.enter && scene.enter(); } }
  else if (fadeA>0) fadeA = Math.max(0, fadeA-.09*f);
  if (scene) scene.frame(f, dt);
  updFx(f);
  if (toastT>0){ toastT-=f; ctx.globalAlpha=clamp(toastT/30,0,1); const w=Math.min(276,TW(toastS)+20); box(W/2-w/2, 300, w, 22, '#1a1c2c', GOLD); T(toastS, W/2, 305, '#ffcd75', 'center'); ctx.globalAlpha=1; }
  ctx.restore();
  if (flashA>0){ ctx.fillStyle=flashC; ctx.globalAlpha=flashA; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; flashA=Math.max(0,flashA-.04*f); }
  ctx.fillStyle='#0000000f'; for (let y=0;y<H;y+=2) ctx.fillRect(0,y,W,1);
  if (fadeA>0){ ctx.fillStyle=INK; ctx.globalAlpha=fadeA; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  clk = null;
  requestAnimationFrame(loop);
}
go(LANG ? TitleScene() : LangScene());
requestAnimationFrame(loop);
